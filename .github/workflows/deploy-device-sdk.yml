name: Deploy device-sdk to PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - 'device-sdk-v*'

jobs:
  publish-scanhub-libraries:
    name: Publish scanhub-libraries
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: services/base/shared_libs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pip install poetry

      - name: Build
        working-directory: services/base/shared_libs
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: services/base/shared_libs/dist/

  publish-device-sdk:
    name: Publish scanhub-device-sdk
    runs-on: ubuntu-latest
    needs: publish-scanhub-libraries
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/device-sdk
            services/base/shared_libs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pip install poetry

      - name: Build
        working-directory: tools/device-sdk
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: tools/device-sdk/dist/
