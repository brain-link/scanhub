name: 'Static Tests'

on:
  pull_request:

jobs:

  Linting:
    name: 'Backend linting & typecheck'
    runs-on: ubuntu-latest
    continue-on-error: True
    strategy:
      matrix:
        target:
          - path: services/protocol-manager
          - path: services/device-manager
          - path: services/user-login-manager
          - path: services/patient-manager
          - path: tools/device-sdk

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "${{ matrix.target.path }}/uv.lock"

      - name: Install dependencies
        working-directory: ${{ matrix.target.path }}
        # --all-extras pulls in the "shared" extra (scanhub-libraries) for the app services;
        # it's a no-op for device-sdk, which declares no optional extras.
        run: uv sync --locked --all-extras --group lint

      - name: Run ruff linter
        working-directory: ${{ matrix.target.path }}
        run: uv run ruff check

      - name: Run mypy type checker
        working-directory: ${{ matrix.target.path }}
        run: uv run mypy
