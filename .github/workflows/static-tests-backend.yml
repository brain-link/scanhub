name: 'Static Tests'

on:
  pull_request:

jobs:

  Linting:
    name: 'Backend linting & typecheck'
    runs-on: ubuntu-latest
    continue-on-error: True
    strategy:
      matrix:
        target:
          - path: services/protocol-manager
            mypy_args: app
          - path: services/device-manager
            mypy_args: app
          - path: services/user-login-manager
            mypy_args: app
          - path: services/patient-manager
            mypy_args: app
          - path: device-sdk
            mypy_args: --strict src

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # services/* are members of the root uv workspace and share its lockfile;
          # device-sdk is a standalone project with its own.
          cache-dependency-glob: |
            uv.lock
            ${{ matrix.target.path }}/uv.lock

      - name: Install dependencies
        working-directory: ${{ matrix.target.path }}
        # Running from within a workspace member syncs just that member against the
        # shared root lockfile, including scanhub-libraries (now a plain dependency).
        run: uv sync --locked --group lint

      - name: Run ruff linter
        working-directory: ${{ matrix.target.path }}
        run: uv run ruff check

      - name: Run mypy type checker
        working-directory: ${{ matrix.target.path }}
        # mypy has no config-inheritance mechanism, so point it at the shared
        # [tool.mypy] block in the root pyproject.toml explicitly.
        run: uv run mypy --config-file ../../pyproject.toml ${{ matrix.target.mypy_args }}
