[project]
name = "scanhub-libraries"
version = "0.0.2"
license = { text = "GPL-3.0-only with custom exception" }
license-files = ["LICENSE", "LICENSE.GPL3", "LICENSE.GPL3-EXCEPT"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.11.7,<3.0.0",
    "sqlalchemy>=2.0.43,<3.0.0",
    "dagster>=1.11.6,<2.0.0",
    "fastapi>=0.116.1,<0.117.0",
    "passlib[argon2]>=1.7.4,<2.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/brain-link/scanhub"

[dependency-groups]
lint = ["ruff>=0.16.3", "mypy>=2.3.1"]

[tool.ruff]
extend = "../../../pyproject.toml"
src = ["src"]
target-version = "py313"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanhub_libraries"]
