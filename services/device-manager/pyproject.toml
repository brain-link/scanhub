[project]
name = "scanhub-device-manager"
version = "0.0.1"
description = "The device manager service is responsible for managing the devices that are connected to scanhub."
authors = [
    {name = "David Schote", email = "david.schote@brain-link.de"},
    {name = "Christoph Dinh", email = "christoph.dinh@brain-link.de"}
]
readme = "README.md"
license = { text = "GPL-3.0-only with custom exception" }
requires-python = ">=3.13,<3.14"
dependencies = [
    "uvicorn>=0.49.0",
    "websockets>=11.0.3",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.6",
    "async-sqlalchemy>=1.0.0",
    "python-multipart>=0.0.6",
    "types-requests>=2.32.0.20250328",
    "numpy>=2.3.2",
    "dagster-graphql",
    "fastapi",
    "scanhub-libraries",
]

[dependency-groups]
test = ["coverage", "codecov", "pytest"]
docs = ["sphinx", "sphinx_rtd_theme"]
lint = ["ruff>=0.16.3", "mypy>=2.3.1"]

[tool.uv]
package = false

[tool.uv.sources]
scanhub-libraries = { workspace = true }

[tool.ruff]
extend = "../../pyproject.toml"
src = ["app"]
target-version = "py310"
