[project]
name = "scanhub-user-manager"
version = "0.0.1"
description = "Provides functionality for user login and user management."
authors = [
    {name = "David Schote", email = "david.schote@brain-link.de"},
    {name = "Christoph Dinh", email = "christoph.dinh@brain-link.de"},
    {name = "Ben Wilhelm", email = "ben.wilhelm@uniklinik-freiburg.de"}
]
readme = "README.md"
license = { text = "GPL-3.0-only with custom exception" }
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncpg>=0.30.0",
    "uvicorn>=0.22.0",
    "psycopg2-binary>=2.9.6",
    "python-multipart>=0.0.6",
    "async-sqlalchemy>=1.0.0",
    "typing-extensions>=4.14.1",
]

[project.optional-dependencies]
# Provided by the scanhub-base Docker image already; kept as an extra (rather than a plain
# dependency) so a container build never needs to see ../base/shared_libs, which lives outside
# this service's build context. Enable locally with `uv sync --extra shared`.
shared = ["scanhub-libraries"]

[dependency-groups]
test = ["coverage", "codecov", "pytest"]
docs = ["sphinx", "sphinx_rtd_theme"]
lint = ["ruff>=0.16.3", "mypy>=2.3.1"]

[tool.uv]
package = false

[tool.uv.sources]
scanhub-libraries = { path = "../base/shared_libs", editable = true }

[tool.ruff]
src = ["app"]
line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
# Enable linters
# E = pycodestyle (error)
# W = pycodestyle (warning)
# F = Pyflakes
# S = flake8-bandit
# I = isort
# N = pep8-naming
# D = pydocstyle
select = ["E", "W", "F", "S", "I", "N", "D"]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
files = ["app"]
python_version = "3.13"
warn_return_any = false
check_untyped_defs = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true
