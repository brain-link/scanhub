[project]
name = "scanhub-orchestration-engine"
version = "0.1.0"
description = "Task orchestration engine built on Dagster for executing computational jobs as directed acyclic graphs (DAGs). Integrates with the device manager to coordinate protocol execution."
authors = [
    {name = "David Schote", email = "david.schote@brain-link.de"},
]
readme = "README.md"
license = { text = "GPL-3.0-only with custom exception" }
license-files = ["LICENSE", "LICENSE.GPL3", "LICENSE.GPL3-EXCEPT"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "dagster-webserver>=1.11.7,<2.0.0",
    "dagster-docker>=0.27.7,<0.28.0",
    "pydicom>=3.0.1,<4.0.0",
    "pydantic>=2.11.7,<3.0.0",
    "numpy>=2.3.2,<3.0.0",
    "requests>=2.32.5,<3.0.0",
    "mrpro>=0.250812",
    "scikit-image>=0.26.0",
]

[tool.dagster]
module = "orchestrator.repository"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]
